# 설치 위치: /etc/nginx/sites-available/alpha-pick-api
# 활성화: sudo ln -s /etc/nginx/sites-available/alpha-pick-api /etc/nginx/sites-enabled/
#
# server_name 자리의 YOUR_DOMAIN을 실제 도메인(또는 EC2 DNS)으로 바꾼 뒤,
# `sudo certbot --nginx -d YOUR_DOMAIN` 을 실행하면 443/TLS 블록은 certbot이
# 이 파일에 자동으로 추가해준다. 직접 SSL 블록을 손으로 쓸 필요 없음.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # nginx 기본값(1m)이면 폰 카메라 사진(보통 2~5MB)이 FastAPI까지 가지도
    # 못하고 413으로 막힌다(OCR 업로드, 사용자 리포트 2026-08-28).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
